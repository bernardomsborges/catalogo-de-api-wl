services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: catalogo
      POSTGRES_USER: catalogo
      # Obrigatória: defina no arquivo .env ou no ambiente antes de subir.
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - catalogo-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U catalogo -d catalogo"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped

  # Uma réplica só: os dados ficam na memória do servidor e os jobs rodam nele. Uma segunda cópia
  # espera a primeira parar (trava no PostgreSQL). Não use `--scale catalogo=2` nem `deploy.replicas`.
  catalogo:
    build: .
    image: catalogo-apis
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin}
      # Obrigatória: defina no arquivo .env ou no ambiente antes de subir.
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Defina ADMIN_PASSWORD}
      # APIs, histórico de versões e rascunhos. No primeiro uso, importa /data/apis.json se existir.
      DATABASE_URL: postgres://catalogo:${DB_PASSWORD}@db:5432/catalogo
      # Avisos por e-mail ("Acompanhar esta API").
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:3000}
      # Atrás de um nginx/load balancer: quantos proxies há na frente (ex.: 1), para os limites usarem o IP real.
      TRUST_PROXY: ${TRUST_PROXY:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-Catálogo de APIs <nao-responda@localhost>}
      # IA (LiteLLM ou outro provedor compatível com OpenAI). Sem LLM_BASE_URL, fica desligada.
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o-mini}
      LLM_EMBEDDING_MODEL: ${LLM_EMBEDDING_MODEL:-text-embedding-3-small}
      # Login com o SSO da organização (OpenID Connect). Sem OIDC_ISSUER, só e-mail e senha.
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      OIDC_LABEL: ${OIDC_LABEL:-}
      OIDC_ALLOWED_DOMAINS: ${OIDC_ALLOWED_DOMAINS:-}
      PASSWORD_LOGIN: ${PASSWORD_LOGIN:-true}
    volumes:
      # Com o banco, tudo fica no PostgreSQL; aqui sobram só os e-mails de teste (outbox).
      - catalogo-data:/data
    restart: unless-stopped

  # Backup do banco com pg_dump: um ao subir e depois a cada BACKUP_EVERY_HOURS horas, no volume
  # catalogo-backups. Apaga os mais velhos que BACKUP_KEEP_DAYS dias. Veja "Backup e restauração" no README.
  backup:
    image: postgres:17-alpine
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: catalogo
      PGDATABASE: catalogo
      PGPASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
      BACKUP_EVERY_HOURS: ${BACKUP_EVERY_HOURS:-24}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - catalogo-backups:/backups
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        while true; do
          f=/backups/catalogo-$$(date +%Y%m%d-%H%M%S).dump
          if pg_dump --format=custom --file="$$f.tmp"; then
            mv "$$f.tmp" "$$f" && echo "[backup] $$f ($$(du -h "$$f" | cut -f1))"
          else
            echo "[backup] o pg_dump falhou; tento de novo no próximo horário" >&2
          fi
          # Sobras de um pg_dump que falhou e backups mais velhos que BACKUP_KEEP_DAYS.
          find /backups -name 'catalogo-*.dump.tmp' -delete
          find /backups -name 'catalogo-*.dump' -mtime +$$BACKUP_KEEP_DAYS -delete
          sleep $$((BACKUP_EVERY_HOURS * 3600))
        done
    restart: unless-stopped

volumes:
  catalogo-db:
  catalogo-data:
  catalogo-backups:
